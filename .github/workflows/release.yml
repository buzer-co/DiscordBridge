name: Test, build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -buildvcs=false -race -count=1 -v .
      - run: python scripts/verify_engine.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Windows state and native UI tests
        env:
          CGO_ENABLED: '0'
        run: go test -buildvcs=false -count=1 -v .
      - name: Save native Windows UI capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-ui
          path: test-results/
          if-no-files-found: warn
      - run: python scripts/verify_engine.py
      - name: Build standalone Windows executable
        run: python build.py dist/DiscordBridge_4_6_Stable.exe
      - name: Verify executable metadata and payload
        run: |
          ./scripts/verify_metadata.ps1 -Path dist/DiscordBridge_4_6_Stable.exe
          python scripts/verify_payload.py dist/DiscordBridge_4_6_Stable.exe
      - name: Package and verify release assets
        run: python scripts/package_release.py
      - name: Save Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DiscordBridge-Windows
          path: dist/*
          if-no-files-found: error
      - name: Publish v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v4.6.0 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Discord Bridge 4.6.0 — Soft UI & repaint fix" --prerelease --notes-file RELEASE_NOTES.md
